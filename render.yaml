services:
  - type: web
    name: ecommerce-api
    runtime: docker
    repo: https://github.com/kingsley805-tech/ecommerce1.git
    branch: main
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: REDIS_URL
        fromService:
          name: ecommerce-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_COOKIE_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@mail.com
      - key: ADMIN_PASSWORD
        value: password
      - key: STOREFRONT_URL
        sync: false
      - key: ADMIN_URL
        sync: false

  - type: redis
    name: ecommerce-redis
    plan: free
    maxmemoryPolicy: noeviction
